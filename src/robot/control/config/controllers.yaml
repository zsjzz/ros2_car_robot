controller_manager:
  ros__parameters:
    update_rate: 30
    use_sim_time: true       # 真机改为 false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # 四轮差速底盘主控制器: 订阅 cmd_vel, 发布 odom
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

# ---------------------------------------------------------------
# 四轮差速: 同侧两轮视为一个等效轮, 靠左右两侧差速实现转向
# ---------------------------------------------------------------
diff_drive_controller:
  ros__parameters:
    use_sim_time: true

    left_wheel_names: ["lf_wheel_joint", "lb_wheel_joint"]
    right_wheel_names: ["rf_wheel_joint", "rb_wheel_joint"]

    # 由 robot_description/urdf/robot_description.urdf.xacro 量测:
    #   轮半径 = 254mm 轮径 / 2
    #   轮距   = 左轮中心(+0.3027) 到 右轮中心(-0.3053)
    wheel_separation: 0.608
    wheel_radius: 0.127

    # 标定用微调系数
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    enable_odom_tf: true
    cmd_vel_timeout: 0.5
    # false => 订阅 geometry_msgs/Twist (Humble 下建议显式指定)
    use_stamped_vel: false

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
    use_local_topics: false
